name: Compilar .so com NDK-Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout do seu repositório
      uses: actions/checkout@v4

    - name: Baixar Template LGL
      run: |
        git clone https://github.com/LGLTeam/Android-Mod-Menu.git template

    - name: Substituir o Main.cpp
      run: |
        cp Main.cpp template/jni/Main.cpp

    - name: Configurar NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r25c

    - name: Compilar com ndk-build
      run: |
        cd template/jni
        $ANDROID_NDK_HOME/ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=Android.mk APP_ABI=arm64-v8a

    - name: Salvar o .so
      uses: actions/upload-artifact@v4
      with:
        name: libmod-so
        path: template/libs/arm64-v8a/*.so
