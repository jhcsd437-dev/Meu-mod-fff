name: Compilar Mod

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Download Template
      run: git clone https://github.com/LGLTeam/Android-Mod-Menu.git template

    - name: Replace Main
      run: cp jni/Main.cpp template/jni/Main.cpp

    - name: Setup NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r25c

    - name: Build SO
      run: |
        cd template/jni
        $ANDROID_NDK_HOME/ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=Android.mk APP_ABI=arm64-v8a

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: meu-mod-so
        path: template/libs/arm64-v8a/*.so
